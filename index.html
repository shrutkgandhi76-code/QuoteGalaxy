    body {
      margin: 0;

      transition: background 0.5s, color 0.5s;

      background: #ff6f61;
      color: white;
      padding: 1rem;
      text-align: center;
      font-size: 2rem;
      font-weight: bold;
    }
    .container {
      max-width: 960px;
      margin: 2rem auto;
      padding: 1rem;
    }
    .category-selector {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .category {
      background: white;
      padding: 1rem;
      text-align: center;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }
    .category:hover {
      transform: scale(1.05);
      background: #ffe9dc;
    }
    .quote-box {
      background: white;
      padding: 1.5rem;
      border-left: 5px solid #ff6f61;
      border-radius: 10px;
      margin: 1rem 0;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .tag {
      display: inline-block;
      margin-top: 0.5rem;
      background: #ffd166;
      padding: 0.3rem 0.7rem;
      border-radius: 4px;
      font-size: 0.8rem;
    }
    .actions {
      margin-top: 1rem;
      display: flex;
      justify-content: center;
      gap: 1rem;
    }
    .btn {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 6px;
      background: #ff6f61;
      color: white;
      cursor: pointer;
      transition: background 0.3s;
    }
    .btn:hover {
      background: #e95b50;
    }
    .dark-mode {
      background: linear-gradient(135deg, #1e1e1e, #2c2c2c);
      color: #f0f0f0;
    }
    .dark-mode header {
      background: #111;
    }
    .dark-mode .category, .dark-mode .quote-box {
      background: #3a3a3a;
      color: #f0f0f0;
    }
    .toggle-dark {
      position: fixed;
      top: 10px;
      right: 10px;
      background: none;
      border: none;
      cursor: pointer;
      z-index: 1000;
    }
  </style>
</head>

    let currentQuote = '';

    function showCategory(category) {
      const quoteContainer = document.getElementById('quoteContainer');
      const quote = quotes[category][Math.floor(Math.random() * quotes[category].length)];
      currentQuote = quote;
      quoteContainer.innerHTML = `
        <div class="quote-box">
          <p id="quoteText">"${quote}"</p>
          <div class="tag">#${category}</div>
        </div>
      `;
    }

    function randomQuote() {
      const categories = Object.keys(quotes);
      const category = categories[Math.floor(Math.random() * categories.length)];
      showCategory(category);
    }

    function copyQuote() {
      if (!currentQuote) return alert('No quote to copy!');
      navigator.clipboard.writeText(currentQuote);
      alert('Quote copied!');
    }

    function shareQuote() {
      if (!currentQuote) return alert('No quote to share!');
      if (navigator.share) {
        navigator.share({ text: currentQuote });
      } else {
        alert('Sharing not supported. Please copy instead.');
      }
    }

    function toggleDarkMode() {
      const body = document.body;
      const icon = document.getElementById('modeIcon');
      body.classList.toggle('dark-mode');
      icon.setAttribute('data-lucide', body.classList.contains('dark-mode') ? 'sun' : 'moon');
      lucide.createIcons();
    }

    window.onload = () => {
      lucide.createIcons();
    };
  </script>
</body>
</html>
